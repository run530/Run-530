<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--ln:#e4e7ec;--ac:#0b7a5a;--ac2:#e6f4ef}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2a313c;--ac:#34c797;--ac2:#12261f}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2a313c;--ac:#34c797;--ac2:#12261f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mu);font-size:14px;margin:0 0 12px}

.pc{font-size:13px;color:var(--mu);margin:6px 0 4px}

.wk{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:0 0 10px;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--ln)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.run{border-top:1px solid var(--ln)}.run:first-of-type{border-top:0}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.row input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ac);flex:none}
.rb{flex:1;cursor:pointer;min-width:0}.rb b{font-size:15px}.ty{font-size:12px;color:var(--mu);margin-left:6px}
.sm{font-size:14px;color:var(--mu)}.next .rb b::after{content:"NEXT";margin-left:8px;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--ac);color:var(--bg)}
.done .sm,.done .rb b{opacity:.55;text-decoration:line-through}.done .dt{text-decoration:none}
.dt{font-size:12px;color:var(--ac)}
.det{display:none;padding:0 14px 14px 50px;font-size:14px}.open .det{display:block}
.det ol{margin:6px 0 8px;padding-left:18px}.det li{margin:3px 0}
.tip{background:var(--ac2);border-radius:8px;padding:8px 10px;margin:8px 0 0}.gf{color:var(--mu);font-size:12px;margin-top:6px}
.hr{margin:10px 0 0;font-size:13px;color:var(--mu)}
button.rs{margin-top:22px;background:none;border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px}

:root{--e:#0f9d74;--q:#e8590c;--l:#2f6fe4;--t:#8a4fd6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--e:#34c797;--q:#ff8a4c;--l:#6b9bff;--t:#b58cf5}}
:root[data-theme="dark"]{--e:#34c797;--q:#ff8a4c;--l:#6b9bff;--t:#b58cf5}
.t-Easy{--c:var(--e)}.t-Quality{--c:var(--q)}.t-Long{--c:var(--l)}.t-Test{--c:var(--t)}
.run{border-left:4px solid var(--c)}.ty{color:var(--c);font-weight:700}
.lg{display:flex;gap:14px;font-size:12px;margin:8px 0 0}.lg span{color:var(--tx)}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
.tabs{display:flex;gap:6px;margin:14px 0 0}.tabs button{flex:1;padding:9px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;font-weight:600}.tabs .on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.st{margin-top:10px;font-size:13px}.up{position:relative;display:inline-block;padding:7px 12px;border:1px dashed var(--ac);color:var(--ac);border-radius:8px;cursor:pointer;font-weight:600}
.mn{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.mn input{width:70px;padding:6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px}.mn button{padding:6px 12px;border:0;border-radius:6px;background:var(--ac);color:var(--bg);font:inherit;font-size:13px;font-weight:600}.er{color:#d92d20;margin-top:4px}
#cal{display:none}.sb{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:12px 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}.sb button{border:0;background:var(--ac);color:var(--bg);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600}
.sd{font-size:13px;color:var(--mu);display:block;margin:0 0 8px}.sd input{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 6px}
.dw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dw{font-size:11px;color:var(--mu);text-align:center;margin-bottom:4px}
.cwh{font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 3px}
.cd{min-height:58px;background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:3px;overflow:hidden}.cd.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.dn{font-size:10px;color:var(--mu);display:block}
.ch{background:var(--c);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:3px 2px;margin-top:3px;text-align:center;cursor:grab;white-space:nowrap}.ch.dn{opacity:.5}.ch.sl{outline:2px solid var(--tx);outline-offset:1px}

main{padding-bottom:96px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:4px 0}#nav b{display:block;font-size:20px;line-height:1.2}#nav .on{color:var(--ac)}
.v{display:none}.v.on{display:block}
.ins div,.sc div{padding:9px 14px;border-top:1px solid var(--ln);font-size:14px}.wr{background:var(--ac2);border-radius:8px}
.cd{display:flex;gap:12px;min-height:64px;padding:8px 10px;border-radius:0;border:0;border-top:1px solid var(--ln);background:var(--card)}.cd.today{box-shadow:inset 3px 0 var(--ac)}
.dl{width:38px;font-size:18px;font-weight:600;line-height:1.2;flex:none}.dl small{display:block;font-size:11px;color:var(--mu)}
.dc{flex:1;min-width:0}.rest{color:var(--mu);font-size:14px;line-height:2.4}
.ch{display:block;text-align:left;font-size:14px;font-weight:600;padding:6px 10px;margin:0 0 4px;border-radius:8px;white-space:normal}.ch small{font-weight:400;opacity:.9}
.cg2{background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-bottom:10px}
.ring{display:flex;justify-content:center;padding:14px}.ring svg{width:150px;height:150px}.ring text{fill:var(--tx);font-size:34px;font-weight:700}.ring small{fill:var(--mu);font-size:10px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.gr div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.gr b{font-size:20px;display:block}.gr small{color:var(--mu);font-size:12px}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;opacity:.4}.bd .got{opacity:1;border-color:var(--ac)}.bd span{display:block;font-size:26px}

.hero{background:linear-gradient(135deg,#0b7a5a,#2f6fe4);color:#fff;border-radius:20px;padding:18px 18px 16px;margin:4px 0 6px;box-shadow:0 6px 18px rgba(11,122,90,.25)}.hero h1{margin:2px 0 4px;font-size:28px}.hero small{letter-spacing:.1em;font-size:11px;opacity:.85}.hero div{font-size:14px;opacity:.95}
h1{font-size:26px;margin:4px 0 8px}h2{font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0;margin:20px 0 8px}
.wk,.cg2,.gr div,.bd div,.sb{border-radius:16px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.wh{background:var(--ac2)}.tag{background:var(--t);color:#fff}
.run{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 45%)}
.rb b{font-size:16px}.ty{background:color-mix(in srgb,var(--c) 15%,transparent);padding:1px 8px;border-radius:10px;font-size:11px}
.bar{height:12px;border-radius:8px}.bar i{background:linear-gradient(90deg,#34c797,#3b82f6);border-radius:8px}
#nav{border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(16,24,40,.08)}#nav .on b{background:var(--ac2);border-radius:14px;display:inline-block;padding:2px 16px}
.gr div:nth-child(1){background:color-mix(in srgb,var(--e) 12%,var(--card))}.gr div:nth-child(2){background:color-mix(in srgb,var(--l) 12%,var(--card))}.gr div:nth-child(3){background:color-mix(in srgb,var(--q) 12%,var(--card))}.gr div:nth-child(4){background:color-mix(in srgb,var(--t) 12%,var(--card))}.gr div:nth-child(5){background:color-mix(in srgb,var(--l) 12%,var(--card))}.gr div:nth-child(6){background:color-mix(in srgb,#e11d48 10%,var(--card))}
.gr b{font-size:22px}.bd .got{background:linear-gradient(160deg,color-mix(in srgb,#f5b301 22%,var(--card)),var(--card));border-color:#f5b301}
.ring{background:linear-gradient(160deg,var(--ac2),var(--card))}.ins div{line-height:1.5}.wr{margin:6px 10px;padding:10px 12px!important;background:color-mix(in srgb,#3b82f6 14%,var(--card))}
.cd.today{background:var(--ac2)}.ch{box-shadow:0 1px 2px rgba(0,0,0,.15)}

:root{--sx:#d6246e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sx:#ff7aa8}.ch,.tag{color:#0b0f14}}
:root[data-theme="dark"]{--sx:#ff7aa8}:root[data-theme="dark"] .ch,:root[data-theme="dark"] .tag{color:#0b0f14}
.sx{flex:none;text-align:right;color:var(--sx);font-weight:700;line-height:1.35;padding-left:6px}.sx b{display:block;font-size:20px;letter-spacing:-.01em}.sx span{display:block;font-size:13px}

.stx{border-radius:16px;padding:14px 16px;margin:10px 0 4px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}.stx b{font-size:20px;display:block;margin-bottom:4px}.stx div{font-size:14px;opacity:.95;margin-top:2px}
.st-g{background:linear-gradient(135deg,#0b7a5a,#16a34a)}.st-a{background:linear-gradient(135deg,#b45309,#f59e0b)}.st-r{background:linear-gradient(135deg,#b42318,#ef4444)}
.ab{margin-left:6px;padding:4px 10px;border:0;border-radius:8px;background:var(--ac);color:var(--bg);font:inherit;font-size:12px;font-weight:700}
</style></head><body><main>
<div class="v" id="v-today"></div><div class="v" id="v-plan"></div><div class="v" id="v-cal"></div><div class="v" id="v-prog"></div>
</main>
<nav id="nav"><button data-v="today"><b>☀️</b>Today</button><button data-v="plan"><b>📋</b>Plan</button><button data-v="cal"><b>📅</b>Calendar</button><button data-v="prog"><b>📈</b>Progress</button></nav>
<script>
var KEY='runplan_v2',S={done:{},stats:{},moved:{},start:'2026-10-07'},sel=null,view='today',OPEN={};
try{var j=localStorage.getItem(KEY);if(j)S=Object.assign(S,JSON.parse(j));else{var o1=localStorage.getItem('runplan_v1');if(o1)S.done=JSON.parse(o1)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function mon(){var d=pd(S.start);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function dateOf(k){if(S.moved[k])return S.moved[k];var a=k.split('-'),d=mon();d.setDate(d.getDate()+7*(a[0]-1)+[2,4,6][a[1]-1]);return iso(d)}
function lab(s){var d=pd(s);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]}
var IC={Easy:'🌿',Quality:'⚡',Long:'🛣️',Test:'🧪'};
var PH=['🌱 Phase 1: Base (weeks 1–4)','🏗️ Phase 2: Build (weeks 5–10)','🔥 Phase 3: Sharpen (weeks 11–16)'];
function ph(w){return w<=4?0:w<=10?1:2}
var EP=['6:30–6:45','6:15–6:30','6:00–6:15'],SP=['5:00–4:45','5:00–4:45','4:55–4:40'];
var ES=[30,32,35,30,35,38,40,30,40,40,40,35,40,40,40,30],EN=[4,4,5,0,4,0,4,0,5,0,4,0,5,0,4,0];
var LG=[40,45,50,40,55,60,65,50,65,70,70,55,75,80,75,45];
var LF={7:[10,'6:00–6:10'],10:[10,'6:00–6:10'],14:[15,'5:55–6:05']};
var TEST={4:1,8:1,12:1,16:1};
var Q={
1:['6 × 1 min surges',['6 × (1 min @ 5:30–5:40, then 2 min easy jog)']],
2:['7 × 1 min surges',['7 × (1 min @ 5:30–5:40, then 2 min easy jog)']],
3:['5 × 2 min surges',['5 × (2 min @ 5:35–5:45, then 2 min easy jog)']],
5:['Hills 6 × 45 sec',['6 × 45 sec uphill hard (about 5K effort, pace doesn\'t matter)','Jog back down, about 90 sec, between reps']],
6:['5 × 4 min intervals',['5 × (4 min @ 5:05–5:15, HR 178–185, then 2 min easy jog)']],
7:['2 × 10 min tempo',['2 × (10 min @ 5:30–5:40, HR 168–174, then 3 min easy)']],
9:['12 × 30/30s',['12 × (30 sec @ 4:40–4:50, then 30 sec easy jog)']],
10:['6 × 4 min intervals',['6 × (4 min @ 5:05–5:15, HR 178–185, then 2 min easy jog)']],
11:['3 × 8 min tempo',['3 × (8 min @ 5:25–5:35, then 2 min easy)']],
13:['4 × 6 min intervals',['4 × (6 min @ 5:10–5:20, HR 176–184, then 2.5 min easy jog)']],
14:['20 min steady',['20 min continuous @ 5:35–5:45, HR 168–176']],
15:['Pyramid 2-3-4-3-2',['Hard reps of 2, 3, 4, 3 and 2 min @ 5:00–5:15','90 sec easy jog between each rep']]};
function shiftP(s){var a=S.adj||0;if(!a)return s;return s.replace(/(\d):(\d\d)/g,function(m,x,y){var v=+x*60+ +y-a;return Math.floor(v/60)+':'+pad(v%60)})}
function run(w,r){var o=run0(w,r);if(S.adj){o.st=o.st.map(shiftP);o.tip=shiftP(o.tip)}return o}
function run0(w,r){
 var i=w-1,p=ph(w),g='W'+(w<10?'0':'')+w+'R'+r,o={g:g};
 if(r==1){
  var n=EN[i];o.t='Easy';o.s=ES[i]+' min easy'+(n?' + '+n+' strides':'');
  o.st=[ES[i]+' min easy at HR up to 150 (pace usually '+EP[p]+')'];
  if(n){o.st.push(n+' × 20 sec strides @ '+SP[p]+', fast but relaxed, with 40 sec walk or jog between');o.st.push('3 min cool-down walk or jog')}
  o.tip='Ignore HR for the first 5–8 min. If HR goes over 150, slow down or walk briefly.'}
 else if(r==3){
  var f=LF[w];o.t='Long';o.s=LG[i]+' min'+(f?', faster finish':' easy');
  o.st=f?[(LG[i]-f[0])+' min easy at HR up to 150','Last '+f[0]+' min @ '+f[1]+' (HR up to about 160)']:[LG[i]+' min easy at HR up to 150 (pace usually '+EP[p]+')'];
  o.tip='Easy means easy. Slow down or walk briefly if HR goes over 150.'}
 else if(TEST[w]){
  o.t='Test';o.s='30 min test run';
  o.st=['5 min easy jog','30 min at an even effort, HR capped at 150, on your usual flat route in the same direction','5 min easy cool-down'];
  o.tip='Record average pace, average HR and conditions (heat, wind). The average pace is your progress number. Send it to Claude.'}
 else{
  var q=Q[w];o.t='Quality';o.s=q[0];
  o.st=['10 min easy warm-up'].concat(q[1],[([1,2,3,5,9].indexOf(w)>-1?5:8)+' min easy cool-down']);
  o.tip='Hard efforts should feel controlled. HR lags at the start of each rep, so use pace and effort for short reps and check HR on reps of 4 min or more.'}
 return o}

function pc(s){var x=Math.round(s.min*60/s.km);return Math.floor(x/60)+':'+pad(x%60)}
function sum(k){var s=S.stats[k];return s&&s.km?s.km.toFixed(1)+' km'+(s.min?' · '+pc(s)+'/km':'')+(s.hr?' · '+s.hr+' bpm avg':''):''}
function setDone(k,on){if(on)S.done[k]=new Date().toISOString();else{delete S.done[k];delete S.stats[k]}save()}
function AK(){var a=[];for(var w=1;w<=16;w++)for(var r=1;r<=3;r++)a.push(w+'-'+r);return a}
function RN(k){var a=k.split('-');return run(+a[0],+a[1])}
function hm(m){return Math.floor(m/60)+'h '+pad(Math.round(m%60))+'m'}
function sx(k){var s=S.stats[k];return s&&s.km?'<div class="sx"><b>'+s.km.toFixed(1)+' km</b>'+(s.min?'<span>'+pc(s)+' /km</span>':'')+(s.hr?'<span>♥ '+s.hr+' bpm</span>':'')+'</div>':''}
function rowH(k,nx){
 var o=RN(k),a=k.split('-'),dn=S.done[k],st=sum(k);
 return '<div class="run t-'+o.t+(dn?' done':'')+(nx?' next':'')+(OPEN[k]?' open':'')+'" data-k="'+k+'"><div class="row"><input type="checkbox" aria-label="Week '+a[0]+' Run '+a[1]+' done"'+(dn?' checked':'')+'><div class="rb"><b>'+IC[o.t]+' Week '+a[0]+' Run '+a[1]+'</b><span class="ty">'+o.t+'</span><div class="sm">'+o.s+'</div><div class="dt">'+lab(dateOf(k))+(dn?' · done':'')+'</div></div>'+sx(k)+'</div><div class="det"><ol>'+o.st.map(function(x){return'<li>'+x+'</li>'}).join('')+'</ol><div class="tip">'+o.tip+'</div><div class="st"><label class="up">Import .fit / .tcx / .zip<input type="file" style="position:absolute;opacity:0;width:1px;height:1px"></label><div class="mn"><input type="number" step="0.01" placeholder="km" class="mk"><input type="number" placeholder="min" class="mm"><input type="number" placeholder="avg HR" class="mh"><button class="sv">Save</button></div><div class="er"></div></div><div class="gf">Garmin file: '+o.g+'.fit</div></div></div>'}
function agg(){
 var ks=AK().filter(function(k){return S.stats[k]&&S.stats[k].km>0}),g={ks:ks,n:AK().filter(function(k){return S.done[k]}).length,km:0,min:0,lg:0,hs:[]};
 ks.forEach(function(k){var s=S.stats[k];g.km+=s.km;g.min+=s.min||0;g.lg=Math.max(g.lg,s.km);if(s.hr)g.hs.push(s.hr)});
 return g}
function eff(k){var s=S.stats[k];return s.hr&&s.min?s.km/s.min*60/s.hr:0}
function mean(a){return a.reduce(function(x,y){return x+y},0)/a.length}
function insights(){
 var g=agg(),o=[],td=iso(new Date()),due=AK().filter(function(k){return dateOf(k)<=td}),dd=due.filter(function(k){return S.done[k]}).length;
 if(due.length)o.push(dd+' of '+due.length+' scheduled runs done so far'+(dd==due.length?'. Right on plan.':'. Missed runs are fine, just don\'t double up.'));
 var ez=g.ks.filter(function(k){var t=RN(k).t;return(t=='Easy'||t=='Long')&&S.stats[k].hr}).map(function(k){return S.stats[k].hr});
 if(ez.length){var m=Math.round(mean(ez.slice(-3)));o.push('Recent easy and long runs average '+m+' bpm. '+(m>150?'That is above the 150 cap. Slow down so they stay truly easy.':'That is inside the 150 cap, which is where the base building happens.'))}
 var ef=g.ks.filter(eff);if(ef.length>=4){var f=mean(ef.slice(0,2).map(eff)),l=mean(ef.slice(-2).map(eff)),p=(l/f-1)*100;o.push('Your pace per heartbeat is '+(p>=0?'up ':'down ')+Math.abs(p).toFixed(1)+'% since your first runs.'+(p>0?' That is the fitness gain we want.':' Heat, fatigue and hills can cause dips, so check the next test run.'))}
 var wk={};g.ks.forEach(function(k){var w=k.split('-')[0];wk[w]=(wk[w]||0)+S.stats[k].km});
 var ws=Object.keys(wk).map(Number).sort(function(a,b){return a-b}),n=ws.length;
